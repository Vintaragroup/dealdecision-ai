# =============================================================================
# ROOT DISPATCHER — NOT FOR LOCAL DEVELOPMENT
#
# This file is a thin dispatcher that extends infra/docker-compose.yml.
# It is used for CI pipelines and legacy infra testing — NOT day-to-day dev.
#
# LOCAL DEV canonical command:
#   ./scripts/docker/local-dev.sh up
#   (uses docker-compose.dev.yml, project name: dealdecision-dev)
#
# Ports in THIS file differ from the dev stack:
#   API  → localhost:9000  (dev stack: 9001)
#   Web  → localhost:5199  (dev stack: 4174)
#   PG   → localhost:55432 (dev stack: 55433)
# =============================================================================
name: infra

services:
  postgres:
    extends:
      file: infra/docker-compose.yml
      service: postgres

  redis:
    extends:
      file: infra/docker-compose.yml
      service: redis

  migrate:
    extends:
      file: infra/docker-compose.yml
      service: migrate

  api:
    extends:
      file: infra/docker-compose.yml
      service: api

  worker:
    extends:
      file: infra/docker-compose.yml
      service: worker

  vision_worker:
    extends:
      file: infra/docker-compose.yml
      service: vision_worker

  web:
    extends:
      file: infra/docker-compose.yml
      service: web

volumes:
  postgres_data:
  redis_data:
  dealdecision_uploads:
  vision_worker_cache:

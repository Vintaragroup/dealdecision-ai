# Render Blueprint
#
# Goal: Docker-based deployment for both API + worker that matches local Docker dev.
# - No shared filesystem assumptions between services.
# - Worker image includes system tools for PDF/Office/image/OCR processing.
#
# Web UI (dealdecision-web) uses apps/web/Dockerfile which runs `pnpm run build`
# (Vite output: apps/web/build/) and serves via `pnpm preview`. This matches
# the local Docker dev stack exactly — no separate static-site service.
# IMPORTANT: VITE_API_BASE_URL and VITE_CLERK_PUBLISHABLE_KEY must also be set
# as Docker Build Arguments in the Render dashboard (Service → Settings →
# Build & Deploy → Docker Build Arguments) so they are baked into the bundle.

services:
  - type: web
    name: dealdecision-web
    runtime: docker
    plan: starter
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Baked into the Vite bundle at Docker build time via ARG/ENV in apps/web/Dockerfile.
      # Must ALSO be set under Docker Build Arguments in the Render dashboard.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_BACKEND_MODE
        value: live

  - type: web
    name: dealdecision-api
    runtime: docker
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_S3_ENDPOINT
        sync: false

  - type: worker
    name: dealdecision-worker
    runtime: docker
    plan: starter
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_VISUAL_EXTRACTION
        value: "1"
      - key: VISUAL_PAGE_IMAGE_PERSIST
        value: "1"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: VISION_BASE_URL
        value: "https://dealdecision-vision-v2.onrender.com"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_S3_ENDPOINT
        sync: false

  - type: web
    name: dealdecision-vision-v2
    runtime: docker
    plan: starter
    dockerfilePath: services/vision_worker/Dockerfile
    dockerContext: services/vision_worker
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: INFO

name: Financial Extraction Regression

# ─────────────────────────────────────────────────────────────────────
# Triggers
#   pull_request   → runs on PRs that touch the extraction pipeline,
#                    financial facts, or the eval suite itself
#   push → main    → guard the main branch
#   workflow_dispatch → run manually at any time
#
# No live services required — runs fully offline against static
# fixture files in evaluation/financial_Audit/.
#
# Exit code semantics (--strict mode):
#   0 → all 10 assertions pass, zero warnings
#   1 → one or more regressions OR warnings detected
# ─────────────────────────────────────────────────────────────────────
on:
  pull_request:
    paths:
      - 'apps/worker/src/extraction/xlsx/**'
      - 'apps/worker/src/lib/financial-*.ts'
      - 'apps/worker/src/lib/financial-facts/**'
      - 'apps/worker/src/lib/cap-table-*.ts'
      - 'packages/core/src/models/financial-*.ts'
      - 'packages/core/src/reports/**'
      - 'services/vision_worker/app/extractors/xlsx_structured.py'
      - 'evaluation/financial_Audit/**'
      - '.github/workflows/financial-extraction-regression.yml'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: financial-extraction-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-regression:
    name: Financial extraction — 10-file golden suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: evaluation/financial_Audit/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl==3.1.5 xlrd==2.0.1

      # ── Node / pnpm (required for `pnpm eval:financial:regression:ci`) ──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── Run extraction on the 10 fixture files ────────────────────
      - name: Run extraction (build overall_summary.json)
        run: python3 evaluation/financial_Audit/run_audit.py

      # ── Run regression evaluator (strict mode) ────────────────────
      # The evaluator prints a ##[group] CI summary block that GitHub
      # Actions renders as a collapsible log section.
      # Exit code 1 on any regression or warning (--strict).
      - name: Run financial regression suite (strict)
        run: pnpm eval:financial:regression:ci

      # ── Upload regression report as artifact ─────────────────────
      # Uploaded even on failure so the report is always inspectable.
      - name: Upload regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-regression-report-${{ github.sha }}
          path: |
            evaluation/financial_Audit/results/regression_check.md
            evaluation/financial_Audit/results/regression_check.json
            evaluation/financial_Audit/results/overall_summary.json
          retention-days: 30

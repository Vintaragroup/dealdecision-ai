services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dealdecision}
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "dealdecision"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vision_worker:
    build:
      context: services/vision_worker
      dockerfile: Dockerfile
      args:
        ENABLE_VISION_UNDERSTANDING: ${ENABLE_VISION_UNDERSTANDING:-0}
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_VISION_UNDERSTANDING: ${ENABLE_VISION_UNDERSTANDING:-0}
      VISION_UNDERSTANDING_CACHE_DIR: /app/.cache/vision_understanding
      XDG_CACHE_HOME: /app/.cache
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8001:8000"
    volumes:
      - dealdecision_uploads:/app/uploads
      - vision_worker_cache:/app/.cache
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.docker.local
    environment:
      NODE_ENV: production
      PORT: "9000"
      UPLOAD_DIR: /app/uploads
      DISABLE_CLERK_AUTH: ${DISABLE_CLERK_AUTH:-1}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
    volumes:
      - dealdecision_uploads:/app/uploads
    ports:
      - "9001:9000"
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env.docker.local
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      ENABLE_VISUAL_EXTRACTION: "1"
      VISUAL_PAGE_IMAGE_PERSIST: "1"
      WORKER_CONCURRENCY: "1"
      VISION_BASE_URL: http://vision_worker:8000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
    volumes:
      - dealdecision_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision_worker:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${WEB_VITE_API_BASE_URL:-http://localhost:9001}
        VITE_BACKEND_MODE: ${VITE_BACKEND_MODE:-live}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    environment:
      NODE_ENV: production
    ports:
      - "4174:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  dealdecision_uploads:
  vision_worker_cache:

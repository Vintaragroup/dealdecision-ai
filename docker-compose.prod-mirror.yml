name: prod-mirror

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dealdecision}
    ports:
      # Avoid clashing with legacy infra stack (which uses 55432)
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "dealdecision"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Avoid clashing with legacy infra stack (which uses 6379)
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vision_worker:
    build:
      context: services/vision_worker
      dockerfile: Dockerfile
      args:
        ENABLE_VISION_UNDERSTANDING: ${ENABLE_VISION_UNDERSTANDING:-0}
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_VISION_UNDERSTANDING: ${ENABLE_VISION_UNDERSTANDING:-0}
      VISION_UNDERSTANDING_CACHE_DIR: /app/.cache/vision_understanding
      XDG_CACHE_HOME: /app/.cache
      HF_HOME: /app/.cache/huggingface
    ports:
      # Avoid clashing with legacy infra stack (vision is internal there)
      - "8001:8000"
    volumes:
      - vision_worker_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dealdecision
      REDIS_URL: redis://redis:6379
      # Local convenience: set DISABLE_CLERK_AUTH=1 in your shell or .env
      DISABLE_CLERK_AUTH: ${DISABLE_CLERK_AUTH:-1}
      # Keep these as pass-throughs so your local .env can mirror Render keys.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
    ports:
      # Avoid clashing with legacy infra stack (which uses 9000)
      - "9001:9000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dealdecision
      REDIS_URL: redis://redis:6379
      ENABLE_VISUAL_EXTRACTION: "1"
      VISUAL_PAGE_IMAGE_PERSIST: "1"
      WORKER_CONCURRENCY: "1"
      # Production points to https://dealdecision-vision-v2.onrender.com; locally we run it via compose.
      VISION_BASE_URL: http://vision_worker:8000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vision_worker:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-time values baked into the Vite bundle.
        # NOTE: use prod-mirror-specific env var names to avoid accidentally picking up root .env values.
        VITE_API_BASE_URL: ${PROD_MIRROR_VITE_API_BASE_URL:-http://localhost:9001}
        VITE_BACKEND_MODE: ${PROD_MIRROR_VITE_BACKEND_MODE:-live}
        VITE_CLERK_PUBLISHABLE_KEY: ${PROD_MIRROR_VITE_CLERK_PUBLISHABLE_KEY:-}
    environment:
      NODE_ENV: production
    ports:
      # Avoid clashing with legacy infra stack (web dev often uses 5173/4173)
      - "4174:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  vision_worker_cache:

name: Investor Insights Audit

# ─────────────────────────────────────────────────────────────────────
# Triggers
#   schedule         → twice daily at ≈09:00 ET and ≈17:00 ET
#                       09:00 ET = 14:00 UTC (09:00 EST / 10:00 EDT)
#                       17:00 ET = 21:00 UTC (17:00 EDT / 16:00 EST)
#                       GitHub Actions cron runs in UTC; clocks shift ±1 h with DST.
#   workflow_dispatch → run manually at any time (safe default)
#   push develop/main → automatic, but ONLY if DATABASE_URL secret is
#                        configured in the repo (job skips otherwise)
# ─────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 14 * * *"  # ≈09:00 ET (14:00 UTC; shifts ±1 h with DST)
    - cron: "0 21 * * *"  # ≈17:00 ET (21:00 UTC; shifts ±1 h with DST)
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

# ─────────────────────────────────────────────────────────────────────
# Concurrency
#   Push/dispatch: cancel in-progress runs on the same ref (fast-feedback).
#   Schedule:      each run gets its own group (run_id) so two daily runs
#                  never cancel each other.
# ─────────────────────────────────────────────────────────────────────
concurrency:
  group: >
    ${{ github.event_name == 'schedule'
        && format('investor-insights-audit-scheduled-{0}', github.run_id)
        || format('investor-insights-audit-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Prerequisite check — if DATABASE_URL is absent the audit can't run.
  # All downstream jobs depend on this gate so they are skipped cleanly
  # rather than failing with a cryptic error.
  # ───────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight — check DB secret
    runs-on: ubuntu-latest
    outputs:
      db_available: ${{ steps.check.outputs.db_available }}
    steps:
      - name: Check for DATABASE_URL secret
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::DATABASE_URL secret is not set — investor-insights audit will be skipped."
            echo "db_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "db_available=true" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────────
  # Soft gate (enforced)
  #   Fails the job on PARSE_HAZARD or BAD_EVIDENCE_REF regressions.
  #   Positioned after test suite runs, before build / deploy.
  # ───────────────────────────────────────────────────────────────────
  investor-insights-soft-gate:
    name: Investor Insights Audit (Soft Gate)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.db_available == 'true'
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: ${{ secrets.PGSSLMODE || 'require' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack + activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if corepack prepare --activate 2>/dev/null; then
            echo "Activated pnpm via repo packageManager."
            pnpm --version
            exit 0
          fi
          corepack prepare pnpm@9.15.0 --activate
          echo "Activated pnpm via fallback pnpm@9.15.0."
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @dealdecision/core (required by worker)
        run: pnpm --filter @dealdecision/core build

      # Position: after tests, before build / deploy.
      # This step enforces parse integrity and evidence reference
      # correctness across the full deal portfolio.
      # MISSING_DPU is intentionally NOT gated here (use gate:strict
      # once DPU coverage reaches acceptable baseline).
      - name: Investor Insights Audit (Soft Gate)
        run: pnpm audit:portfolio:gate:soft

      # ── Artifact upload (always, so the report is inspectable) ─────
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-insights-audit-${{ github.sha }}
          path: |
            apps/worker/tmp/investor-insights-audit.json
            apps/worker/tmp/investor-insights-audit.md
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────
  # Coverage trend gate (soft — enforced, non-blocking on first usage)
  #   Runs coverage audit and compares against the committed baseline.
  #   Fails if DETECTOR_GAP INCREASES for the global total OR for the
  #   selected slot (currently: use_of_funds).
  #   Skips gracefully when DATABASE_URL secret is absent (same preflight
  #   pattern as the soft gate above).
  #
  #   Strict version (disabled with `if: false`) would require week-over-week
  #   improvement by rolling the baseline forward periodically.
  # ───────────────────────────────────────────────────────────────────
  coverage-trend-gate:
    name: Coverage Trend Gate (use_of_funds + market_claims — soft)
    runs-on: ubuntu-latest
    needs: [preflight, investor-insights-soft-gate]
    if: needs.preflight.outputs.db_available == 'true'
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: ${{ secrets.PGSSLMODE || 'require' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack + activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if corepack prepare --activate 2>/dev/null; then
            pnpm --version
            exit 0
          fi
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @dealdecision/core (required by worker)
        run: pnpm --filter @dealdecision/core build

      # Generate current coverage audit snapshot
      - name: Run coverage audit (current snapshot)
        run: |
          TS=$(date +%Y%m%dT%H%M%SZ)
          pnpm --filter worker audit:investor-insights:coverage -- \
            --deal-list apps/worker/tmp/audit_deals.json \
            --concurrency 4 \
            --out apps/worker/tmp/coverage-ci-${TS}
          echo "COVERAGE_CURRENT=apps/worker/tmp/coverage-ci-${TS}.json" >> "$GITHUB_ENV"

      # Compare against committed baseline — fail if DETECTOR_GAP increased
      - name: Run coverage trend gate
        run: |
          pnpm --filter worker coverage-trend-gate -- \
            --baseline apps/worker/tmp/coverage_baseline.json \
            --current  "$COVERAGE_CURRENT" \
            --slot     use_of_funds
          pnpm --filter worker coverage-trend-gate -- \
            --baseline apps/worker/tmp/coverage_baseline.json \
            --current  "$COVERAGE_CURRENT" \
            --slot     market_claims

      # Always upload the current audit artifact for inspection
      - name: Upload coverage audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-audit-${{ github.sha }}
          path: |
            apps/worker/tmp/coverage-ci-*.json
            apps/worker/tmp/coverage-ci-*.md
            apps/worker/tmp/investor-insights-coverage-audit-*.json
            apps/worker/tmp/investor-insights-coverage-audit-*.md
            apps/worker/tmp/investor-insights-audit.json
            apps/worker/tmp/investor-insights-audit.md
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────
  # (DISABLED — strict improvement gate, enable when rolling baseline forward)
  # Requires DETECTOR_GAP to strictly decrease vs baseline week-over-week.
  # Enable by removing `if: false` and wiring a baseline-update job.
  # ───────────────────────────────────────────────────────────────────
  coverage-trend-gate-strict:
    name: Coverage Trend Gate (strict improvement — not enabled)
    runs-on: ubuntu-latest
    needs: preflight
    # ⚠️  DISABLED: enable once baseline roll-forward automation is in place
    if: false
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: ${{ secrets.PGSSLMODE || 'require' }}
    steps:
      - run: echo "Strict improvement gate — not yet enabled"

  # ───────────────────────────────────────────────────────────────────
  # Strict gate (DEFINED — not enabled yet)
  #   Adds MISSING_DPU to the failure classes.
  #   Enable by changing `if: false` to
  #     if: needs.preflight.outputs.db_available == 'true'
  #   once DPU coverage across the portfolio is acceptable.
  # ───────────────────────────────────────────────────────────────────
  investor-insights-strict-gate:
    name: Investor Insights Audit (Strict Gate — not enabled)
    runs-on: ubuntu-latest
    needs: preflight
    # ⚠️  DISABLED: change `false` to enable once DPU baseline is met
    if: false
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: ${{ secrets.PGSSLMODE || 'require' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack + activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if corepack prepare --activate 2>/dev/null; then
            pnpm --version
            exit 0
          fi
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @dealdecision/core
        run: pnpm --filter @dealdecision/core build

      - name: Investor Insights Audit (Strict Gate)
        run: pnpm audit:portfolio:gate:strict

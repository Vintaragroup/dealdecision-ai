name: Financial Extraction Regression

# ─────────────────────────────────────────────────────────────────────
# Fully offline — no live services, no secrets required.
#
# Runs against static fixture files in evaluation/financial_Audit/.
# Gate: fails on any regression or warning (--strict mode).
# Runs on EVERY pull request — no path filter applied.
#
# Exit code semantics (--strict):
#   0 → all 10 assertions pass, zero warnings
#   1 → one or more regressions OR warnings detected
#
# Artifacts uploaded on every run (including failure) so CI failures
# are diagnosable without re-running locally.
# ─────────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: financial-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-regression:
    name: Financial extraction — 10-file golden suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Source ─────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. pnpm (must precede setup-node for cache: pnpm to work) ─
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      # ── 3. Node (pnpm cache keyed on lockfile) ────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Python (pip cache keyed on requirements.txt hash) ──────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: evaluation/financial_Audit/requirements.txt

      # ── 5. Python deps ────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r evaluation/financial_Audit/requirements.txt

      # ── 6. Extraction run (writes overall_summary.json) ──────────
      - name: Run extraction
        run: python evaluation/financial_Audit/run_audit.py

      # ── 7. Regression assertions (strict — fail on warnings too) ──
      # Prints per-file pass/fail with assertion details to stdout.
      # Emits ##[group] CI summary block (collapsible in Actions UI).
      # Exit code 1 on any regression or warning.
      - name: Assert golden suite
        run: python evaluation/financial_Audit/evaluate_regression.py --strict

      # ── 8. Upload report artifacts ────────────────────────────────
      # if: always() ensures upload even when step 7 exits non-zero.
      # regression_check.md  — human-readable per-file pass/fail
      # regression_check.json — machine-readable for downstream tools
      # overall_summary.json  — raw extraction output (debug source)
      - name: Upload regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-regression-report-${{ github.sha }}
          path: |
            evaluation/financial_Audit/results/regression_check.md
            evaluation/financial_Audit/results/regression_check.json
            evaluation/financial_Audit/results/overall_summary.json
          if-no-files-found: warn
          retention-days: 30

name: Fixtures governance

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: fixtures-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable corepack + activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          if corepack prepare --activate; then
            echo "Activated pnpm via repo packageManager (corepack prepare --activate)."
            pnpm --version
            exit 0
          fi
          corepack prepare pnpm@9.15.0 --activate
          echo "Activated pnpm via fallback pnpm@9.15.0."
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run governed snapshot invariant tests
        run: pnpm --filter api test -- fixture-report-snapshots.test.ts

      - name: Regenerate verification report
        run: pnpm exec tsx apps/api/scripts/fixture-verification-report.ts

      - name: Verify working tree clean
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree is dirty after verification steps."
            echo "\n--- git status --porcelain"
            git status --porcelain
            echo "\n--- git diff --stat"
            git diff --stat
            echo "\n--- git diff"
            git diff
            exit 1
          fi
